[project]
site_name = "zensical-pele"
site_description = "Render Mermaid diagrams with Pele in Zensical and MkDocs."
site_author = "Felipe Adeildo"
site_url = "https://felipeadeildo.github.io/zensical-pele/"
repo_url = "https://github.com/felipeadeildo/zensical-pele"
repo_name = "felipeadeildo/zensical-pele"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Felipe Adeildo"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Configuration" = "configuration.md" },
  { "Theming" = "theming.md" },
  { "How it works" = "how-it-works.md" },
  { "Gallery" = [
    "examples/index.md",
    # Gallery pages, generated by scripts/sync_pele_examples.py: start
    { "Block" = "examples/block.md" },
    { "C4" = "examples/c4.md" },
    { "Class" = "examples/class.md" },
    { "Entity relationship" = "examples/er.md" },
    { "Event modeling" = "examples/eventmodeling.md" },
    { "Flowchart" = "examples/flowchart.md" },
    { "Gantt" = "examples/gantt.md" },
    { "Git graph" = "examples/git.md" },
    { "Kanban" = "examples/kanban.md" },
    { "Mindmap" = "examples/mindmap.md" },
    { "Packet" = "examples/packet.md" },
    { "Pie" = "examples/pie.md" },
    { "Quadrant chart" = "examples/quadrant.md" },
    { "Requirement" = "examples/requirement.md" },
    { "Sankey" = "examples/sankey.md" },
    { "Sequence" = "examples/sequence.md" },
    { "State" = "examples/state.md" },
    { "Timeline" = "examples/timeline.md" },
    { "User journey" = "examples/journey.md" },
    { "XY chart" = "examples/xychart.md" },
    { "Agentflow" = "examples/agentflow.md" },
    { "Architecture" = "examples/architecture.md" },
    { "Cynefin" = "examples/cynefin.md" },
    { "Ishikawa" = "examples/ishikawa.md" },
    { "Radar" = "examples/radar.md" },
    { "Railroad" = "examples/railroad.md" },
    { "Swimlane" = "examples/swimlane.md" },
    { "Tree view" = "examples/treeview.md" },
    { "Treemap" = "examples/treemap.md" },
    { "Use case" = "examples/usecase.md" },
    { "Venn" = "examples/venn.md" },
    { "Wardley map" = "examples/wardley.md" },
    # Gallery pages, generated by scripts/sync_pele_examples.py: end
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.zensical_pele]
